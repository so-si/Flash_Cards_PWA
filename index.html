<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Flash Cards</title>
<link rel="manifest" href="./manifest.json">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input{font:inherit}.wrap{max-width:760px;margin:0 auto;padding:22px 18px 36px}.title{font-size:30px;font-weight:800;margin:4px 0 20px}.panel{border:1px solid #444;border-radius:18px;padding:18px;margin:0 0 16px}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #777;background:#111;color:#fff;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:700}.btn.primary{background:#fff;color:#000;border-color:#fff}.btn.answer{flex:1;min-width:130px;font-size:34px;padding:18px}.muted{color:#aaa;font-size:14px;line-height:1.6}.status{font-size:15px;line-height:1.7;margin-top:10px}.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.subject{display:flex;align-items:center;gap:8px;border:1px solid #444;border-radius:12px;padding:12px}.subject input{width:20px;height:20px}.hidden{display:none!important}.card-meta{font-size:18px;color:#bbb;line-height:1.6}.card-no{font-size:23px;font-weight:800;color:#fff}.precedent{font-size:20px;font-weight:700;margin-top:4px}.question{font-size:25px;line-height:1.65;font-weight:650;white-space:pre-wrap;margin:28px 0}.result{border-top:1px solid #444;margin-top:22px;padding-top:22px}.answer-text{font-size:34px;font-weight:900}.accuracy{font-size:19px;margin-top:10px}.top-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.small{padding:9px 12px;font-size:14px}.message{min-height:24px;color:#bbb;font-size:14px;margin-top:10px}.stats-big{font-size:22px;font-weight:800;margin:5px 0}.goal-big{font-size:27px;font-weight:900;margin:6px 0}.goal-done{font-size:15px;margin-top:6px}.offline-label{font-size:13px;color:#aaa}.next{width:100%;margin-top:22px;font-size:20px;padding:16px}.explanation{margin-top:20px;padding:16px;border:1px solid #555;border-radius:14px;background:#0b0b0b}.explanation-title{font-size:17px;font-weight:800;margin-bottom:8px}.explanation-text{font-size:17px;line-height:1.75;white-space:pre-wrap}.detail-link{display:inline-block;margin-top:12px;color:#fff;text-decoration:underline;font-weight:700}.source{margin-top:9px;color:#aaa;font-size:13px;line-height:1.5}.performance-title{font-size:20px;font-weight:800;margin-bottom:8px}.performance-details{border-top:1px solid #333;padding-top:10px;margin-top:10px}.performance-details summary{cursor:pointer;font-size:16px;font-weight:800;padding:6px 0}.stats-table-wrap{overflow-x:auto;margin-top:8px}.stats-table-wrap.daily{max-height:420px;overflow-y:auto}.stats-table{width:100%;border-collapse:collapse;font-size:15px}.stats-table th,.stats-table td{padding:9px 6px;border-bottom:1px solid #2c2c2c;text-align:right;white-space:nowrap}.stats-table th:first-child,.stats-table td:first-child{text-align:left}.stats-table th{color:#aaa;font-size:13px;font-weight:700}.stats-empty{color:#888;font-size:14px;padding:10px 0}.stats-note{color:#888;font-size:12px;margin-top:8px;line-height:1.5}@media(max-width:520px){.wrap{padding:16px 14px 28px}.title{font-size:27px}.question{font-size:23px}.subjects{grid-template-columns:1fr}.panel{padding:15px}.explanation{padding:14px}.stats-table{font-size:14px}.stats-table th,.stats-table td{padding:8px 4px}}
</style>
</head>
<body>
<div class="wrap">
<section id="homeView">
<div class="title">短答 Flash Cards</div>
<div class="panel"><div class="row"><button class="btn primary" id="onlineBtn">オンラインで最新版を読む</button><button class="btn" id="offlineBtn">オフライン用に保存</button><button class="btn small" id="tokenBtn">接続キーを設定・変更</button></div><div id="offlineStatus" class="status"></div><div id="message" class="message"></div></div>
<div class="panel"><div class="muted">今日の目標</div><div id="dailyText" class="goal-big">今日 0 / 50問</div><div id="dailyDone" class="goal-done"></div></div>
<div class="panel"><div class="muted">累積成績</div><div id="statsText" class="stats-big">回答 0問 / 正解 0問 / 正答率 0.0%</div><div id="pendingText" class="offline-label"></div></div>
<div class="panel">
<div class="performance-title">学習成績</div>
<details class="performance-details" open><summary>科目ごとの正答率</summary><div id="subjectStats"></div></details>
<details class="performance-details" open><summary>日々の回答数・正答率</summary><div id="dailyStats"></div><div class="stats-note">直近30日を表示</div></details>\n<details class="performance-details" open><summary>日別ランキング</summary><div id="dailyRankings"></div></details>
</div>
<div class="panel"><div style="font-size:20px;font-weight:800">科目</div><div id="subjects" class="subjects"></div><div class="row" style="margin-top:14px"><button class="btn small" id="allSubjectsBtn">全選択</button><button class="btn small" id="clearSubjectsBtn">全解除</button></div></div>
<button class="btn primary" id="startBtn" style="width:100%;font-size:21px;padding:17px">学習開始</button>
</section>
<section id="cardView" class="hidden">
<div class="top-actions"><button class="btn small" id="backBtn">← 戻る</button><div id="progress" class="muted"></div></div>
<div class="panel">
<div class="card-meta"><div id="cardNo" class="card-no"></div><div id="cardSubject"></div><div id="cardPrecedent" class="precedent"></div></div>
<div id="question" class="question"></div>
<div id="answerButtons" class="row"><button class="btn answer" data-answer="○">○</button><button class="btn answer" data-answer="×">×</button></div>
<div id="result" class="result hidden">
<div id="correctAnswer" class="answer-text"></div>
<div id="explanationBox" class="explanation"><div class="explanation-title">解説</div><div id="explanationText" class="explanation-text"></div><a id="detailLink" class="detail-link hidden" href="#" target="_blank" rel="noopener noreferrer">詳しい解説を見る</a><div id="sourceText" class="source"></div></div>
<div id="questionAccuracy" class="accuracy"></div><div id="accuracy" class="accuracy"></div><div id="dailyResult" class="accuracy"></div>
<button class="btn primary next" id="nextBtn">次の問題</button>
</div></div>
</section>
</div>
<script src="./config.js"></script>
<script>
const API_URL=(window.FLASH_CARDS_CONFIG||{}).apiUrl||'';
const TOKEN_KEY='flashCardsApiTokenV1',OFFLINE_KEY='flashCardsOfflineCardsV1',PENDING_KEY='flashCardsPendingV1',STATS_KEY='flashCardsStatsV4',QUESTION_STATS_KEY='flashCardsQuestionStatsV1',BREAKDOWN_KEY='flashCardsStatsBreakdownV1';
const DAILY_GOAL=50,SUBJECT_ORDER=['憲法','民法','行政法','商法','会社法','民事訴訟法','民訴法','刑法','刑事訴訟法','刑訴法'];
let sessionCards=[],studyCards=[],currentIndex=0,answered=false,remoteStats=loadJson(STATS_KEY,{total:0,correct:0,todayCount:0,today:''}),remoteQuestionStats=loadJson(QUESTION_STATS_KEY,{}),remoteBreakdown=loadJson(BREAKDOWN_KEY,{subjects:{},days:[]}),syncPromise=null;
function $(id){return document.getElementById(id)}function loadJson(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch{return f}}function saveJson(k,v){localStorage.setItem(k,JSON.stringify(v))}function token(){return localStorage.getItem(TOKEN_KEY)||''}function setMessage(t){$('message').textContent=t||''}function normalizeAnswer(v){return ['〇','○'].includes(String(v).trim())?'○':['✕','×','X','x'].includes(String(v).trim())?'×':String(v).trim()}function uuid(){return crypto&&crypto.randomUUID?crypto.randomUUID():'fc_'+Date.now()+'_'+Math.random().toString(36).slice(2)}function jstDate(iso){const d=iso?new Date(iso):new Date();return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function apiRequest(action,payload={}){if(!API_URL)return Promise.reject(new Error('GAS URLが設定されていません。'));if(!token())return Promise.reject(new Error('先に接続キーを設定してください。'));return new Promise((resolve,reject)=>{const cb='fc_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let timer;window[cb]=data=>{clearTimeout(timer);delete window[cb];s.remove();data&&data.success===false?reject(new Error(data.error||'APIエラー')):resolve(data||{})};timer=setTimeout(()=>{delete window[cb];s.remove();reject(new Error('通信がタイムアウトしました。'))},20000);const q=new URLSearchParams({action,callback:cb,token:token(),payload:JSON.stringify(payload)});s.src=API_URL+'?'+q.toString();s.onerror=()=>{clearTimeout(timer);delete window[cb];s.remove();reject(new Error('GASへの接続に失敗しました。'))};document.head.appendChild(s)})}
function setApiToken(){const v=prompt('接続キーを入力してください。',token());if(v!==null){localStorage.setItem(TOKEN_KEY,v.trim());setMessage('接続キーを保存しました。')}}function getOfflineData(){return loadJson(OFFLINE_KEY,null)}function availableCards(){return sessionCards.length?sessionCards:(getOfflineData()?.cards||[])}function updateOfflineStatus(){const d=getOfflineData();$('offlineStatus').textContent=d&&Array.isArray(d.cards)?`オフライン保存：${d.cards.length}問 / ${new Date(d.updatedAt).toLocaleString('ja-JP')}`:'オフライン保存：未保存'}function subjectSort(a,b){const ia=SUBJECT_ORDER.indexOf(a),ib=SUBJECT_ORDER.indexOf(b);if(ia>=0||ib>=0){if(ia<0)return 1;if(ib<0)return-1;return ia-ib}return a.localeCompare(b,'ja')}function renderSubjects(cards){const box=$('subjects');box.innerHTML='';[...new Set(cards.map(c=>c.subject).filter(Boolean))].sort(subjectSort).forEach(s=>{const l=document.createElement('label'),i=document.createElement('input');l.className='subject';i.type='checkbox';i.value=s;i.checked=true;l.append(i,document.createTextNode(s));box.appendChild(l)})}
async function loadOnlineCards(){if(!navigator.onLine){setMessage('オフラインです。保存済みカードを使ってください。');return}try{setMessage('最新版を取得しています…');const r=await apiRequest('getFlashCards');sessionCards=Array.isArray(r.cards)?r.cards:[];renderSubjects(sessionCards);await syncPending();await refreshStats();setMessage(`最新版 ${sessionCards.length}問を読み込みました。`)}catch(e){setMessage(e.message)}}async function saveOfflineCards(){if(!navigator.onLine){setMessage('オフライン中は更新できません。');return}try{setMessage('オフライン用カードを保存しています…');const r=await apiRequest('getFlashCards'),cards=Array.isArray(r.cards)?r.cards:[];saveJson(OFFLINE_KEY,{cards,updatedAt:new Date().toISOString()});sessionCards=cards;renderSubjects(cards);updateOfflineStatus();await syncPending();await refreshStats();setMessage(`${cards.length}問をオフライン用に保存しました。`)}catch(e){setMessage(e.message)}}
function pendingEvents(){return loadJson(PENDING_KEY,[])}function setPending(e){saveJson(PENDING_KEY,e);updateStatsDisplay()}function pendingToday(){const today=jstDate();return pendingEvents().filter(x=>jstDate(x.timestamp)===today).length}function displayStats(){const p=pendingEvents(),today=jstDate(),baseToday=remoteStats.today===today?Number(remoteStats.todayCount||0):0;return{total:Number(remoteStats.total||0)+p.length,correct:Number(remoteStats.correct||0)+p.filter(x=>x.isCorrect).length,todayCount:baseToday+pendingToday()}}
function combinedSubjectStats(){const out={};const base=remoteBreakdown&&remoteBreakdown.subjects&&typeof remoteBreakdown.subjects==='object'?remoteBreakdown.subjects:{};Object.keys(base).forEach(k=>out[k]={total:Number(base[k].total||0),correct:Number(base[k].correct||0)});pendingEvents().forEach(ev=>{const k=ev.subject||'未分類';if(!out[k])out[k]={total:0,correct:0};out[k].total++;if(ev.isCorrect)out[k].correct++});return out}
function normalizeDayKey(v){const s=String(v||'').trim();if(/^\\d{4}-\\d{2}-\\d{2}$/.test(s))return s;const d=new Date(v);return isNaN(d)?s:jstDate(d.toISOString())}function combinedDailyStats(){const out={};const days=remoteBreakdown&&Array.isArray(remoteBreakdown.days)?remoteBreakdown.days:[];days.forEach(d=>{if(d&&d.date){const key=normalizeDayKey(d.date);if(key)out[key]={total:Number(d.total||0),correct:Number(d.correct||0)}}});pendingEvents().forEach(ev=>{const day=jstDate(ev.timestamp);if(!out[day])out[day]={total:0,correct:0};out[day].total++;if(ev.isCorrect)out[day].correct++});return out}
function pct(correct,total){return total?((correct/total)*100).toFixed(1)+'%':'0.0%'}
function renderPerformanceStats(){
  const subjectBox=$('subjectStats'),dailyBox=$('dailyStats'),rankingBox=$('dailyRankings');
  if(!subjectBox||!dailyBox||!rankingBox)return;
  const subjects=combinedSubjectStats(),subjectKeys=Object.keys(subjects).sort(subjectSort);
  if(!subjectKeys.length){
    subjectBox.innerHTML='<div class="stats-empty">まだ学習データがありません。</div>';
  }else{
    subjectBox.innerHTML='<div class="stats-table-wrap"><table class="stats-table"><thead><tr><th>科目</th><th>回答</th><th>正解</th><th>正答率</th></tr></thead><tbody>'+
      subjectKeys.map(k=>{const s=subjects[k];return `<tr><td>${escapeHtml(k)}</td><td>${s.total}</td><td>${s.correct}</td><td>${pct(s.correct,s.total)}</td></tr>`}).join('')+
      '</tbody></table></div>';
  }
  const dayMap=combinedDailyStats(),allDayKeys=Object.keys(dayMap).sort().reverse(),dayKeys=allDayKeys.slice(0,30);
  if(!dayKeys.length){
    dailyBox.innerHTML='<div class="stats-empty">まだ日別データがありません。</div>';
    rankingBox.innerHTML='<div class="stats-empty">まだランキング対象データがありません。</div>';
    return;
  }
  dailyBox.innerHTML='<div class="stats-table-wrap daily"><table class="stats-table"><thead><tr><th>日付</th><th>回答</th><th>正解</th><th>正答率</th></tr></thead><tbody>'+
    dayKeys.map(k=>{const s=dayMap[k];return `<tr><td>${formatDayLabel(k)}</td><td>${s.total}</td><td>${s.correct}</td><td>${pct(s.correct,s.total)}</td></tr>`}).join('')+
    '</tbody></table></div>';
  const today=jstDate(),cutoff=new Date(today+'T00:00:00+09:00');cutoff.setDate(cutoff.getDate()-29);
  const cutoffKey=jstDate(cutoff.toISOString());
  const recentKeys=allDayKeys.filter(k=>k>=cutoffKey&&k<=today);
  rankingBox.innerHTML=renderRankingSection('直近1か月',recentKeys,dayMap)+renderRankingSection('過去全日',allDayKeys,dayMap);
}
function renderRankingSection(title,keys,dayMap){
  if(!keys.length)return `<div class="stats-empty">${title}：データがありません。</div>`;
  const byCount=[...keys].sort((a,b)=>dayMap[b].total-dayMap[a].total||dayMap[b].correct-dayMap[a].correct||b.localeCompare(a));
  const byAccuracy=[...keys].sort((a,b)=>{
    const ar=dayMap[a].total?dayMap[a].correct/dayMap[a].total:0,br=dayMap[b].total?dayMap[b].correct/dayMap[b].total:0;
    return br-ar||dayMap[b].total-dayMap[a].total||b.localeCompare(a);
  });
  return `<div class="performance-details"><div style="font-size:16px;font-weight:800;padding:6px 0">${title}</div>
    <div class="muted" style="margin-top:4px">回答数ランキング</div>${rankingTable(byCount,dayMap)}
    <div class="muted" style="margin-top:12px">正答率ランキング</div>${rankingTable(byAccuracy,dayMap)}</div>`;
}
function rankingTable(keys,dayMap){
  const top=keys.slice(0,10);
  return '<div class="stats-table-wrap"><table class="stats-table"><thead><tr><th>順位</th><th>日付</th><th>回答</th><th>正答率</th></tr></thead><tbody>'+
    top.map((k,i)=>{const s=dayMap[k];return `<tr><td>${i+1}</td><td>${formatDayLabel(k)}</td><td>${s.total}</td><td>${pct(s.correct,s.total)}</td></tr>`}).join('')+
    '</tbody></table></div>';
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatDayLabel(v){
  const key=normalizeDayKey(v),p=String(key).split('-');if(p.length!==3)return String(v);
  const y=Number(p[0]),m=Number(p[1]),d=Number(p[2]);
  const dt=new Date(`${p[0]}-${p[1]}-${p[2]}T00:00:00+09:00`);
  const wd=['日','月','火','水','木','金','土'][dt.getDay()];
  return `${String(y).slice(-2)}年${m}月${d}日（${wd}）`;
}
function updateStatsDisplay(){const s=displayStats(),rate=s.total?((s.correct/s.total)*100).toFixed(1):'0.0';$('statsText').textContent=navigator.onLine?`回答 ${s.total}問 / 正解 ${s.correct}問 / 正答率 ${rate}%`:'';$('dailyText').textContent=`今日 ${s.todayCount} / ${DAILY_GOAL}問`;$('dailyDone').textContent=s.todayCount>=DAILY_GOAL?'本日の目標達成':'あと '+Math.max(DAILY_GOAL-s.todayCount,0)+'問';const p=pendingEvents();$('pendingText').textContent=p.length?`未同期の回答：${p.length}件`:'回答履歴は同期済みです。';renderPerformanceStats()}
async function refreshStats(){if(!navigator.onLine||!token())return;try{const r=await apiRequest('getFlashStatsBundle'),b=r.bundle||{},stats=b.stats||{},daily=b.daily||{};remoteStats={total:Number(stats.total||0),correct:Number(stats.correct||0),todayCount:Number(daily.count||0),today:daily.date||jstDate()};remoteQuestionStats=b.questions&&typeof b.questions==='object'?b.questions:{};remoteBreakdown={subjects:b.subjects&&typeof b.subjects==='object'?b.subjects:{},days:Array.isArray(b.days)?b.days:[]};saveJson(STATS_KEY,remoteStats);saveJson(QUESTION_STATS_KEY,remoteQuestionStats);saveJson(BREAKDOWN_KEY,remoteBreakdown);updateStatsDisplay()}catch(e){console.warn(e)}}function questionDisplayStats(cardNo){const base=remoteQuestionStats[String(cardNo)]||{},pending=pendingEvents().filter(x=>String(x.cardNo)===String(cardNo));return{total:Number(base.total||0)+pending.length,correct:Number(base.correct||0)+pending.filter(x=>x.isCorrect).length}}function showQuestionStats(cardNo){const el=$('questionAccuracy');if(!navigator.onLine){el.textContent='';return}const s=questionDisplayStats(cardNo),rate=s.total?((s.correct/s.total)*100).toFixed(1):'0.0';el.textContent=`この問題：${s.correct} / ${s.total}（${rate}%）`}function promoteSyncedEvent(ev){remoteStats.total=Number(remoteStats.total||0)+1;if(ev.isCorrect)remoteStats.correct=Number(remoteStats.correct||0)+1;const today=jstDate();if(remoteStats.today!==today){remoteStats.today=today;remoteStats.todayCount=0}if(jstDate(ev.timestamp)===today)remoteStats.todayCount=Number(remoteStats.todayCount||0)+1;const no=String(ev.cardNo),s=remoteQuestionStats[no]||{total:0,correct:0};s.total=Number(s.total||0)+1;if(ev.isCorrect)s.correct=Number(s.correct||0)+1;remoteQuestionStats[no]=s;if(!remoteBreakdown||typeof remoteBreakdown!=='object')remoteBreakdown={subjects:{},days:[]};if(!remoteBreakdown.subjects)remoteBreakdown.subjects={};const sub=ev.subject||'未分類',ss=remoteBreakdown.subjects[sub]||{total:0,correct:0};ss.total=Number(ss.total||0)+1;if(ev.isCorrect)ss.correct=Number(ss.correct||0)+1;remoteBreakdown.subjects[sub]=ss;const day=jstDate(ev.timestamp);if(!Array.isArray(remoteBreakdown.days))remoteBreakdown.days=[];let ds=remoteBreakdown.days.find(x=>x.date===day);if(!ds){ds={date:day,total:0,correct:0,accuracy:0};remoteBreakdown.days.push(ds)}ds.total=Number(ds.total||0)+1;if(ev.isCorrect)ds.correct=Number(ds.correct||0)+1;ds.accuracy=ds.total?ds.correct/ds.total:0;remoteBreakdown.days=remoteBreakdown.days.sort((a,b)=>String(a.date).localeCompare(String(b.date)));saveJson(STATS_KEY,remoteStats);saveJson(QUESTION_STATS_KEY,remoteQuestionStats);saveJson(BREAKDOWN_KEY,remoteBreakdown)}async function syncPending(){if(!navigator.onLine||!token())return;if(syncPromise)return syncPromise;syncPromise=(async()=>{const q=pendingEvents(),remain=[];for(const ev of q){try{await apiRequest('saveFlashResult',ev);promoteSyncedEvent(ev)}catch(e){remain.push(ev)}}const added=pendingEvents().slice(q.length);setPending(remain.concat(added))})();try{await syncPromise}finally{syncPromise=null}if(navigator.onLine&&token()&&pendingEvents().length)syncPending()}
function selectedSubjects(){return[...document.querySelectorAll('#subjects input:checked')].map(x=>x.value)}function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function startStudy(){const cards=availableCards();if(!cards.length){setMessage('カードがありません。まず最新版を読むか、オフライン用に保存してください。');return}const selected=selectedSubjects();studyCards=shuffle(cards.filter(c=>!selected.length||selected.includes(c.subject)));if(!studyCards.length){setMessage('選択した科目にカードがありません。');return}currentIndex=0;$('homeView').classList.add('hidden');$('cardView').classList.remove('hidden');showCard()}
function showCard(){answered=false;const c=studyCards[currentIndex];$('cardNo').textContent=`問${c.no||c.id||''}`;$('cardSubject').textContent=c.subject||'';$('cardPrecedent').textContent=c.precedent||'';$('question').textContent=c.question||'';$('progress').textContent=`${currentIndex+1} / ${studyCards.length}`;$('answerButtons').classList.remove('hidden');$('result').classList.add('hidden');$('questionAccuracy').textContent='';$('explanationText').textContent='';$('detailLink').classList.add('hidden');$('detailLink').removeAttribute('href');$('sourceText').textContent=''}
function answerCard(userAnswer){if(answered)return;answered=true;const c=studyCards[currentIndex],correct=normalizeAnswer(c.answer),chosen=normalizeAnswer(userAnswer),isCorrect=correct===chosen,cardNo=String(c.no||c.id||'');const event={eventId:uuid(),timestamp:new Date().toISOString(),cardNo,subject:c.subject||'',userAnswer:chosen,correctAnswer:correct,isCorrect};const q=pendingEvents();q.push(event);setPending(q);$('answerButtons').classList.add('hidden');$('result').classList.remove('hidden');$('correctAnswer').textContent=`${isCorrect?'正解':'不正解'}　正答：${correct}`;$('explanationText').textContent=c.explanation||'';$('sourceText').textContent=c.source?`出典：${c.source}`:'';if(c.detailUrl){$('detailLink').href=c.detailUrl;$('detailLink').classList.remove('hidden')}showQuestionStats(cardNo);const s=displayStats(),rate=s.total?((s.correct/s.total)*100).toFixed(1):'0.0';$('accuracy').textContent=navigator.onLine?`正答率：${s.correct} / ${s.total}（${rate}%）`:'';$('dailyResult').textContent=`今日：${s.todayCount} / ${DAILY_GOAL}問`;syncPending()}
function nextCard(){currentIndex++;if(currentIndex>=studyCards.length)currentIndex=0;showCard()}function backHome(){$('cardView').classList.add('hidden');$('homeView').classList.remove('hidden');updateStatsDisplay()}function init(){updateOfflineStatus();updateStatsDisplay();const cards=availableCards();if(cards.length)renderSubjects(cards);$('onlineBtn').onclick=loadOnlineCards;$('offlineBtn').onclick=saveOfflineCards;$('tokenBtn').onclick=setApiToken;$('startBtn').onclick=startStudy;$('backBtn').onclick=backHome;$('nextBtn').onclick=nextCard;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answerCard(b.dataset.answer));$('allSubjectsBtn').onclick=()=>document.querySelectorAll('#subjects input').forEach(x=>x.checked=true);$('clearSubjectsBtn').onclick=()=>document.querySelectorAll('#subjects input').forEach(x=>x.checked=false);if(navigator.onLine&&token())syncPending().then(refreshStats);if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(console.warn)}window.addEventListener('online',()=>syncPending().then(refreshStats));window.addEventListener('offline',updateStatsDisplay);document.addEventListener('DOMContentLoaded',init);
</script>
</body></html>
